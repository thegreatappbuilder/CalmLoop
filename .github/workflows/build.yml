name: Build Calm Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pregătește cheia de semnare (dacă există)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            echo "KEYSTORE_FILE=upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Cheie de semnare găsită."
          else
            echo "Nu există cheie: APK-ul va fi semnat cu cheia de test (bun doar pentru instalare manuală)."
          fi

      - name: Construiește APK și AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CalmLoop-APK
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalmLoop-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Șterge cheia
        if: always()
        run: rm -f upload-keystore.jks
